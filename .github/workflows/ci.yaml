name: Nix CI

on:
  pull_request:

jobs:
  nix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable flakes
        run: |
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf

      - name: Check formatting
        run: |
          nix fmt -- --fail-on-change

      - name: Flake check
        run: nix flake check

      - name: Evaluate supported Home Manager profiles
        # hindemith retains its pre-existing invalid desktop option.
        run: |
          nix eval --json .#homeConfigurations --apply '
            configs: builtins.mapAttrs (_: hm: hm.activationPackage.drvPath) {
              inherit (configs) matthias "matthias@vogel";
            }
          '

      - name: Verify public input isolation
        run: |
          jq -e '
            [.nodes[] | .locked?, .original? | select(. != null)] |
            all(.[]; (.type != "path") and (.type != "git") and (.type != "indirect"))
          ' flake.lock
